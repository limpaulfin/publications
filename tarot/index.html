<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <link rel="icon" href="tarot-favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
        <title>Tarot Thập Giá - Nhập liệu</title>
        <script>window.__dbgErrors=[];window.addEventListener("error",function(e){window.__dbgErrors.push({msg:e.message,src:e.filename,line:e.lineno,at:new Date().toISOString()});});</script>
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/tarot1.css" />
        <link rel="stylesheet" href="css/components/tarot-suggest.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="card">
                <h1>
                    <i class="fas fa-moon"></i> Tarot thập giá (Cậu3Tarot)
                    <span class="header-actions">
                        <button id="qr-btn" class="icon-btn" title="Hiện mã QR để chia sẻ app"><i class="fas fa-qrcode"></i><small>Mã QR</small></button>
                        <button id="reset-btn" class="icon-btn" title="Xoá tất cả"><i class="fas fa-redo"></i><small>Xoá</small></button>
                    </span>
                </h1>
                <div class="learn-banner">
                    <div class="learn-actions">
                        <a id="slides-link" class="learn-btn" target="_blank" rel="noopener"><i class="fas fa-file-lines"></i> Xem slide</a>
                        <a id="video-link" class="learn-btn" target="_blank" rel="noopener"><i class="fas fa-circle-play"></i> Xem video</a>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2><i class="fas fa-circle-user"></i> Thông tin người hỏi</h2>
                <div class="form-group">
                    <label for="querent-name">Tên</label>
                    <input type="text" id="querent-name" placeholder="Nhập tên..." autocomplete="off" />
                </div>
                <div class="form-row">
                    <div class="form-group form-half">
                        <label for="querent-gender">Giới tính</label>
                        <select id="querent-gender">
                            <option value="Male">Nam</option>
                            <option value="Female">Nữ</option>
                            <option value="Other">Khác</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                        <label>Ngày sinh</label>
                        <div class="dob-row">
                            <select id="querent-birth-day" aria-label="Ngày sinh">
                                <option value="">Ngày</option>
                            </select>
                            <select id="querent-birth-month" aria-label="Tháng sinh">
                                <option value="">Tháng</option>
                            </select>
                            <select id="querent-birth" aria-label="Năm sinh">
                                <option value="">Năm</option>
                            </select>
                        </div>
                </div>
                <div id="querent-history"></div>
            </div>

            <div class="card">
                <h2>Câu hỏi</h2>
                <div class="form-group">
                    <label for="question-select">Chọn chủ đề</label>
                    <select id="question-select">
                        <option value="Blind Reading">Bói mù</option>
                        <option value="Love & Relationships">Tình yêu & Mối quan hệ</option>
                        <option value="Career & Work">Sự nghiệp & Công việc</option>
                        <option value="Finance & Money">Tài chính & Tiền bạc</option>
                        <option value="Health">Sức khoẻ</option>
                        <option value="Family">Gia đình</option>
                        <option value="Education & Growth">Học tập & Phát triển</option>
                        <option value="Spirituality & Inner Self">Tâm linh & Nội tâm</option>
                        <option value="Important Decision">Quyết định quan trọng</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="custom-question">Câu hỏi cụ thể (tuỳ chọn)</label>
                    <input type="text" id="custom-question" placeholder="Nhập câu hỏi cụ thể nếu có..." />
                </div>
            </div>

            <div class="card">
                <h2>10 vị trí bài (Thập Giá Celtic)
                    <span class="h2-actions">
                        <button id="random-btn" class="reset-btn" title="Rút bài ngẫu nhiên"><i class="fas fa-dice"></i></button>
                        <button id="clear-cards-btn" class="reset-btn" title="Xoá lá bài + kết quả"><i class="fas fa-eraser"></i></button>
                        <button id="tour-btn" class="reset-btn" title="Hướng dẫn sử dụng"><i class="fas fa-circle-info"></i></button>
                    </span>
                </h2>
                <div id="card-positions"></div>
            </div>

            <div class="card">
                <button id="generate-btn" class="generate-btn">
                    <i class="fas fa-wand-magic-sparkles"></i> Giải bài
                </button>
            </div>

            <div class="card" id="result-card" style="display:none;">
                <h2>Trải bài Celtic Cross
                    <button id="download-spread-btn" class="reset-btn" title="Tải ảnh trải bài (đúng kích thước, đúng vị trí)"><i class="fas fa-download"></i> Tải ảnh</button>
                </h2>
                <div id="spread-visual" class="spread-grid"></div>
                <div id="history-inject" style="display:none;"></div>
                <h2 id="toggle-json" style="cursor:pointer;">Kết quả
                    <label style="font-size:0.7em;margin-left:8px;cursor:pointer;"><input type="radio" name="copy-format" value="json"> JSON</label>
                    <label style="font-size:0.7em;margin-left:8px;cursor:pointer;"><input type="radio" name="copy-format" value="base64" checked> Base64</label>
                    <i class="fas fa-chevron-down"></i>
                </h2>
                <textarea id="json-output" class="json-output" readonly style="display:none;"></textarea>
                <div class="btn-row">
                    <button id="copy-json-btn" class="generate-btn copy-btn-tarot">
                        <i class="fas fa-copy"></i> Sao chép
                    </button>
                    <button id="share-btn" class="generate-btn share-btn">
                        <i class="fas fa-share-alt"></i> Chia sẻ
                    </button>
                    <button id="scroll-top-btn" class="generate-btn scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            </div>

            <div class="copyright">
                &copy; 2023 Thanh-Phong Lam &middot; <a href="https://orcid.org/0009-0001-7790-5671" target="_blank" rel="noopener" class="orcid-link"><i class="fab fa-orcid"></i> ORCID</a><br>
                <span class="art-credit">Hình ảnh lá bài: bộ Rider-Waite-Smith, tranh của Pamela Colman Smith (1909)</span>
            </div>

            <div class="debug-bar">
                <button id="dbg-download" class="debug-btn" type="button" title="Chia sẻ JSON" aria-label="Chia sẻ JSON"><i class="fas fa-arrow-up-from-bracket"></i></button>
                <button id="dbg-dar" class="debug-btn dar-btn" type="button" title="DAR" aria-label="DAR"><i class="fas fa-eye"></i></button>
                <span id="dbg-bundle-id" class="dbg-bundle-id"></span>
            </div>
            <div id="deo-overlay" class="deo-overlay" style="display:none"></div>
        </div>

        <div class="vignette-overlay" id="vignette"></div>
        <div class="mystical-bar" id="mystical-bar">
            <div class="pos-label" id="bar-pos"></div>
            <div class="card-reveal" id="bar-card"></div>
        </div>

        <script src="js/tarot-deck.js"></script>
        <script src="js/tarot-positions.js"></script>
        <script src="js/tarot-auth.js"></script>
        <script src="js/tarot-card-preview.js"></script>
        <script src="js/tarot-images.js"></script>
        <script src="js/tarot-random.js"></script>
        <script src="js/tarot-storage.js"></script>
        <script src="js/tarot-api.js"></script>
        <script src="js/tarot-history-policy.js"></script>
        <script src="js/tarot-querent-history.js"></script>
        <script src="js/tarot-querent-ui.js"></script>
        <script src="js/tarot-querent.js"></script>
        <script src="js/tarot-ui.js"></script>
        <script src="js/tarot1.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <script src="js/tarot-qr.js"></script>
        <script src="js/tarot-pull-refresh.js"></script>
        <script src="js/tarot-debug.js"></script>
        <script src="js/tarot-tour.js"></script>
    </body>
</html>
